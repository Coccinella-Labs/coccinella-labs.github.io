<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>coccinella labs</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #121417;
      --panel: #24282d;
      --text: #e6e1d8;
      --muted: #8a8f86;
      --line: #343a40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      width: min(36rem, calc(100% - 2rem));
      margin: 0 auto;
      display: grid;
      place-content: center;
      gap: 1.5rem;
    }

    .mark {
      width: 5rem;
      height: 5rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      display: grid;
      place-items: center;
    }

    .mark img {
      width: 3rem;
      height: 3rem;
      object-fit: contain;
      opacity: 0.82;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: 0;
    }

    p {
      max-width: 24rem;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    a {
      color: var(--muted);
      text-decoration: none;
      text-underline-offset: 0.2em;
    }

    a:hover,
    a:focus-visible {
      color: var(--text);
      text-decoration: underline;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --text: #24282d;
        --muted: #72776f;
        --line: #d9dbd6;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <img src="mark.png" alt="" />
    </div>

    <section aria-labelledby="title">
      <h1 id="title">coccinella labs</h1>
      <p>software.</p>
    </section>

    <nav aria-label="links">
      <a href="https://github.com/Coccinella-Labs">github</a>
      <a href="https://github.com/Coccinella-Labs/coccinella-labs.github.io">repository</a>
      <a href="LICENSE">mit</a>
    </nav>
  </main>
</body>
</html>
